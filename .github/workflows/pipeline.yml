name: NetDevOps CI-CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pre-check:
    name: Validation, Schema & Dry-Run Diff
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Vault Password
        run: |
          if [ -f "$HOME/.vault_pass" ]; then
            cp "$HOME/.vault_pass" spine-leaf-fabric/.vault_pass
            cp "$HOME/.vault_pass" corporate-office/.vault_pass
          elif [ -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > spine-leaf-fabric/.vault_pass
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > corporate-office/.vault_pass
          fi
          chmod 600 spine-leaf-fabric/.vault_pass 2>/dev/null || true
          chmod 600 corporate-office/.vault_pass 2>/dev/null || true

      - name: Run YAML Linting
        run: |
          yamllint .

      - name: Validate Spine-Leaf Schema with Pydantic
        run: |
          cd spine-leaf-fabric && python3 scripts/validate_schema.py

      - name: Validate Corporate Office Schema with Pydantic
        run: |
          cd corporate-office && python3 scripts/validate_corp_schema.py

      - name: Test Corporate Office Config Generation
        run: |
          cd corporate-office && python3 scripts/generate_configs.py

      - name: Spine-Leaf Ansible Syntax Check
        run: |
          cd spine-leaf-fabric && ansible-playbook playbooks/deploy.yml --syntax-check

      - name: Corporate Office Ansible Syntax Check
        run: |
          cd corporate-office && ansible-playbook playbooks/deploy_corp.yml --syntax-check

      - name: Spine-Leaf Ansible Dry-Run & Configuration Diff
        run: |
          cd spine-leaf-fabric && ansible-playbook playbooks/deploy.yml --check --diff | tee ../pr_diff.log

  deploy-to-fabric:
    name: Live Fabric Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Vault Password
        run: |
          if [ -f "$HOME/.vault_pass" ]; then
            cp "$HOME/.vault_pass" spine-leaf-fabric/.vault_pass
            cp "$HOME/.vault_pass" corporate-office/.vault_pass
          elif [ -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > spine-leaf-fabric/.vault_pass
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > corporate-office/.vault_pass
          fi
          chmod 600 spine-leaf-fabric/.vault_pass 2>/dev/null || true
          chmod 600 corporate-office/.vault_pass 2>/dev/null || true

      - name: Push Fabric Config via Ansible
        run: |
          cd spine-leaf-fabric && ansible-playbook playbooks/deploy.yml
