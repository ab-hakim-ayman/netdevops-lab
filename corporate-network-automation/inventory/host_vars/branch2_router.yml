---
hostname: "br2-rtr01"
site_name: "Branch-Chittagong"
site_prefix: "10.20.0.0/16"

wan_interfaces:
  - name: "ether1"
    description: "ISP1-Primary-Fiber"
    ip: "203.0.114.2/30"
    gateway: "203.0.114.1"
    bandwidth: "50M"
    role: "primary"
  - name: "ether2"
    description: "ISP2-Backup-Radio"
    ip: "198.51.101.2/30"
    gateway: "198.51.101.1"
    bandwidth: "30M"
    role: "backup"

lan_bridge: "bridge-lan"
trunk_interfaces:
