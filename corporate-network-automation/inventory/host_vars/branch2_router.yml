      public_key: "HQ_WG_PUBLIC_KEY_12345="
      allowed_ips: "10.255.255.1/32,10.10.0.0/16"
      remote_subnet: "10.10.0.0/16"
      endpoint_address: "203.0.113.2"
      endpoint_port: 51820
      persistent_keepalive: 25
