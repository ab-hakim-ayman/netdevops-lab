      public_key: "BRANCH2_WG_PUBLIC_KEY_67890="
      allowed_ips: "10.255.255.2/32,10.20.0.0/16"
      remote_subnet: "10.20.0.0/16"
      endpoint_address: "203.0.114.2"
      endpoint_port: 51820
