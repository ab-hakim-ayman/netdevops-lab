    description: "ISP1-Primary-Fiber"
    ip: "203.0.113.2/30"
    gateway: "203.0.113.1"
    bandwidth: "100M"
    role: "primary"
  - name: "ether2"
    description: "ISP2-Backup-Radio"
    ip: "198.51.100.2/30"
    gateway: "198.51.100.1"
    bandwidth: "50M"
    role: "backup"

