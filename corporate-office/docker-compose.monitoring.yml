# Docker Compose Stack for Corporate Office Observability & Monitoring
# Includes Prometheus, Grafana, and MikroTik RouterOS Exporter
---
services:
  corporate-prometheus:
    image: prom/prometheus:latest
    container_name: corporate-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - corporate-prometheus-data:/prometheus

  corporate-grafana:
    image: grafana/grafana:latest
    container_name: corporate-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./configs/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./configs/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./configs/grafana/dashboards/mikrotik-corporate-overview.json:/var/lib/grafana/dashboards/mikrotik-corporate-overview.json:ro
      - corporate-grafana-data:/var/lib/grafana

  corporate-mikrotik-exporter:
    image: nshttpd/mikrotik-exporter:1.0.11
    container_name: corporate-mikrotik-exporter
    restart: unless-stopped
    environment:
      CONFIG_FILE: /etc/mikrotik-exporter/config.yml
    ports:
      - "9436:9436"
    volumes:
      - ./configs/mikrotik-exporter/config.yml:/etc/mikrotik-exporter/config.yml:ro


volumes:
  corporate-prometheus-data:
  corporate-grafana-data:
